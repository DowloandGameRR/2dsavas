<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Online Savaş Oyunu</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-analytics.js";
        import { 
            getDatabase, ref, set, onValue, onDisconnect, remove, update, push, child, get
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-database.js";
        import { 
            getAuth, signInAnonymously, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjTSEE1FQmQl-qqwFR-XOgb01xEMceCpc",
            authDomain: "game-ad0bb.firebaseapp.com",
            databaseURL: "https://game-ad0bb-default-rtdb.firebaseio.com",
            projectId: "game-ad0bb",
            storageBucket: "game-ad0bb.firebasestorage.app",
            messagingSenderId: "271751730777",
            appId: "1:271751730777:web:3589b14dae4242bf6a8348",
            measurementId: "G-5PPLWRVXR6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        window.gameDB = db;
        window.gameAuth = auth;
        window.gameRef = ref;
        window.gameOnValue = onValue;
        window.gameSet = set;
        window.gameUpdate = update;
        window.gameRemove = remove;
        window.gameOnDisconnect = onDisconnect;

        window.signInGuest = async function() {
            try { const result = await signInAnonymously(auth); return result.user; } 
            catch (error) { alert("Giriş yapılamadı: " + error.message); }
        };
    </script>
</head>
<body style="margin: 0; padding: 0; background: #1a1a2e; overflow: hidden; font-family: 'Segoe UI', sans-serif;">
    
    <div id="login-screen" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(255,255,255,0.1); padding: 40px; border-radius: 20px; text-align: center; color: white; z-index: 1000;">
        <h1>⚔️ 2D Savaş Arenası</h1>
        <div style="margin: 20px 0;">
            <input type="text" id="player-name" placeholder="Oyuncu Adın" maxlength="15" style="padding: 10px; font-size: 16px; border-radius: 8px; border: none; width: 200px;">
        </div>
        <button onclick="startGame('guest')" style="padding: 12px 30px; font-size: 16px; background: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer;">Giriş Yap</button>
    </div>

    <div id="game-container" style="display: none;"></div>

    <div id="ui-overlay" style="display: none; position: absolute; top: 10px; left: 10px; color: white; z-index: 100; pointer-events: none;">
        <div style="background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px;">
            <div>❤️ Can: <span id="hp-display">100</span></div>
            <div>🏆 Skor: <span id="score-display">0</span></div>
            <div>👥 Oyuncu: <span id="player-name-display">-</span></div>
        </div>
    </div>

    <script type="module">
        let currentUser = null;
        let playerName = "Oyuncu";

        window.startGame = async function(type) {
            playerName = document.getElementById('player-name').value || "Misafir";
            currentUser = await window.signInGuest();

            if (currentUser) {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'block';
                document.getElementById('ui-overlay').style.display = 'block';
                document.getElementById('player-name-display').textContent = playerName;
                initGame(currentUser.uid);
            }
        };

        function initGame(userId) {
            const config = {
                type: Phaser.AUTO,
                width: window.innerWidth,
                height: window.innerHeight,
                parent: 'game-container',
                backgroundColor: '#16213e',
                physics: {
                    default: 'arcade',
                    arcade: { gravity: { y: 0 }, debug: false }
                },
                scene: { preload: preload, create: create, update: update }
            };

            const game = new Phaser.Game(config);

            let player;
            let otherPlayers = {};
            let localBullets;  // Bizim sıktığımız mermiler
            let enemyBullets;  // Düşmanların sıktığı ve bize hasar verebilecek mermiler 🛠️
            let cursors, wasd, mousePointer;
            let playerRef, playersRef, bulletsRef;
            let lastFired = 0;
            let minimapCamera;
            
            const FIRE_RATE = 200;
            const PLAYER_SPEED = 300;
            const BULLET_SPEED = 800;
            const WORLD_WIDTH = 2000;
            const WORLD_HEIGHT = 2000;

            function preload() {
                // Kendi Oyuncumuz (Mavi)
                let pGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                pGraphics.fillStyle(0x3498db, 1);
                pGraphics.fillRect(0, 0, 40, 40);
                pGraphics.fillStyle(0x2c3e50, 1);
                pGraphics.fillRect(30, 12, 15, 16);
                pGraphics.generateTexture('player_texture', 45, 40);

                // Rakip Oyuncular (Kırmızı - Net ayrışması için isim değiştirildi) 🛠️
                let eGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                eGraphics.fillStyle(0xe74c3c, 1);
                eGraphics.fillRect(0, 0, 40, 40);
                eGraphics.fillStyle(0x2c3e50, 1);
                eGraphics.fillRect(30, 12, 15, 16);
                eGraphics.generateTexture('enemy_texture', 45, 40);

                // Mermi
                let bGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                bGraphics.fillStyle(0xf1c40f, 1);
                bGraphics.fillCircle(5, 5, 5);
                bGraphics.generateTexture('bullet_texture', 10, 10);

                // Zemin
                let gGraphics = this.make.graphics({ x: 0, y: 0, add: false });
                gGraphics.fillStyle(0x1a1a2e, 1);
                gGraphics.fillRect(0, 0, 100, 100);
                gGraphics.lineStyle(1, 0x0f3460, 0.5);
                gGraphics.strokeRect(0, 0, 100, 100);
                gGraphics.generateTexture('ground_texture', 100, 100);
            }

            function create() {
                const scene = this;

                // Zemin döşeme
                for (let x = 0; x < WORLD_WIDTH; x += 100) {
                    for (let y = 0; y < WORLD_HEIGHT; y += 100) {
                        scene.add.image(x + 50, y + 50, 'ground_texture');
                    }
                }

                scene.physics.world.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
                scene.cameras.main.setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

                // Fizik Grupları
                localBullets = scene.physics.add.group();
                enemyBullets = scene.physics.add.group(); // Düşman mermileri için fizik grubu 🛠️

                // Oyuncu kurulumu
                const startX = Phaser.Math.Between(200, WORLD_WIDTH - 200);
                const startY = Phaser.Math.Between(200, WORLD_HEIGHT - 200);
                
                player = scene.physics.add.sprite(startX, startY, 'player_texture');
                player.setCollideWorldBounds(true).setDepth(10);
                player.hp = 100;
                player.score = 0;

                scene.cameras.main.startFollow(player, true, 0.1, 0.1);

                // Kullanıcı Arayüzü (UI) Elemanları
                player.nameText = scene.add.text(startX, startY - 30, playerName, {
                    fontSize: '14px', fill: '#ffffff', stroke: '#000000', strokeThickness: 3
                }).setOrigin(0.5).setDepth(11);
                player.hpBar = scene.add.graphics().setDepth(11);
                updateHpBar(player);

                // Mini Harita Düzenlemesi
                minimapCamera = scene.cameras.add(window.innerWidth - 170, 20, 150, 150).setZoom(0.07).setName('minimap');
                minimapCamera.setBackgroundColor('#1a1a2e').setBounds(0, 0, WORLD_WIDTH, WORLD_HEIGHT);
                minimapCamera.startFollow(player, true, 0.1, 0.1);
                minimapCamera.ignore([player.nameText, player.hpBar]);

                // Girdiler
                cursors = scene.input.keyboard.createCursorKeys();
                wasd = scene.input.keyboard.addKeys({
                    up: Phaser.Input.Keyboard.KeyCodes.W, down: Phaser.Input.Keyboard.KeyCodes.S,
                    left: Phaser.Input.Keyboard.KeyCodes.A, right: Phaser.Input.Keyboard.KeyCodes.D
                });
                mousePointer = scene.input.activePointer;

                // Firebase Tanımlamaları
                playerRef = window.gameRef(window.gameDB, `players/${userId}`);
                playersRef = window.gameRef(window.gameDB, 'players');
                bulletsRef = window.gameRef(window.gameDB, 'bullets');

                window.gameSet(playerRef, {
                    x: startX, y: startY, hp: 100, score: 0, angle: 0, name: playerName, lastUpdate: Date.now()
                });
                window.gameOnDisconnect(playerRef).remove();

                // ============================================
                // ÇARPIŞMA (HASAR ALMA) SİSTEMİ 🛠️
                // ============================================
                scene.physics.add.overlap(player, enemyBullets, (localPlayer, bullet) => {
                    // Mermi bize ait değilse hasar ver
                    if (bullet.getData('owner') !== userId) {
                        const attackerId = bullet.getData('owner');
                        bullet.destroy(); // Mermiyi yok et
                        takeDamage(10, attackerId);
                    }
                });

                // ============================================
                // OYUNCULARI VE MERMİLERİ DİNLEME
                // ============================================
                window.gameOnValue(playersRef, (snapshot) => {
                    const playersData = snapshot.val();
                    if (!playersData) return;

                    Object.keys(playersData).forEach((uid) => {
                        if (uid === userId) {
                            // Kendi can ve skor verilerimizi eşitle
                            const myData = playersData[uid];
                            if (myData.hp !== player.hp) {
                                player.hp = myData.hp;
                                updateHpBar(player);
                                document.getElementById('hp-display').textContent = Math.max(0, player.hp);
                            }
                            player.score = myData.score || 0;
                            document.getElementById('score-display').textContent = player.score;
                            return;
                        }

                        const data = playersData[uid];

                        // Eğer rakip sahnede yoksa `enemy_texture` ile yarat 🛠️
                        if (!otherPlayers[uid]) {
                            const otherPlayer = scene.physics.add.sprite(data.x, data.y, 'enemy_texture');
                            otherPlayer.setDepth(10);
                            
                            otherPlayer.nameText = scene.add.text(data.x, data.y - 30, data.name || "Rakip", {
                                fontSize: '14px', fill: '#ff6b6b', stroke: '#000000', strokeThickness: 3
                            }).setOrigin(0.5).setDepth(11);
                            
                            otherPlayer.hpBar = scene.add.graphics().setDepth(11);
                            otherPlayer.hp = data.hp;
                            
                            otherPlayer.targetX = data.x;
                            otherPlayer.targetY = data.y;
                            otherPlayer.targetAngle = data.angle || 0;

                            minimapCamera.ignore([otherPlayer.nameText, otherPlayer.hpBar]);
                            otherPlayers[uid] = otherPlayer;
                        } else {
                            // Mevcut rakibin hedeflerini güncelle
                            const op = otherPlayers[uid];
                            op.targetX = data.x;
                            op.targetY = data.y;
                            op.targetAngle = data.angle;
                            op.hp = data.hp;
                        }

                        // Can durumuna göre görünürlük ayarla
                        const opObj = otherPlayers[uid];
                        if (opObj) {
                            updateHpBar(opObj);
                            const isAlive = opObj.hp > 0;
                            opObj.setVisible(isAlive);
                            opObj.nameText.setVisible(isAlive);
                            opObj.hpBar.setVisible(isAlive);
                        }
                    });

                    // Ayrılanları sil
                    Object.keys(otherPlayers).forEach((uid) => {
                        if (!playersData[uid]) {
                            if (otherPlayers[uid]) {
                                otherPlayers[uid].nameText.destroy();
                                otherPlayers[uid].hpBar.destroy();
                                otherPlayers[uid].destroy();
                                delete otherPlayers[uid];
                            }
                        }
                    });
                });

                // Mermileri Dinle 🛠️
                window.gameOnValue(bulletsRef, (snapshot) => {
                    const bulletsData = snapshot.val();
                    if (!bulletsData) return;

                    Object.keys(bulletsData).forEach((bulletId) => {
                        const data = bulletsData[bulletId];
                        if (data.owner === userId) return; // Kendi mermimizse es geç

                        // Sahnede bu mermi yoksa enemyBullets grubuna ekle 🛠️
                        if (!scene.children.getByName(bulletId)) {
                            const bullet = enemyBullets.create(data.x, data.y, 'bullet_texture');
                            if (bullet) {
                                bullet.setName(bulletId);
                                bullet.setDepth(5);
                                bullet.setData('owner', data.owner); // Kimin attığını merminin içine kaydet
                                
                                const velocity = scene.physics.velocityFromRotation(data.angle, BULLET_SPEED);
                                bullet.setVelocity(velocity.x, velocity.y);
                                
                                scene.time.delayedCall(2500, () => {
                                    if (bullet.active) bullet.destroy();
                                });
                            }
                        }
                    });
                });

                // Ateş etme tetikleyicisi
                scene.input.on('pointerdown', (pointer) => {
                    if (pointer.leftButtonDown() && player.hp > 0) {
                        fireBullet(scene, pointer);
                    }
                });
            }

            function update(time, delta) {
                if (!player || player.hp <= 0) return;

                // Hareket Kontrolleri
                let vx = 0, vy = 0;
                if (cursors.left.isDown || wasd.left.isDown) vx = -PLAYER_SPEED;
                if (cursors.right.isDown || wasd.right.isDown) vx = PLAYER_SPEED;
                if (cursors.up.isDown || wasd.up.isDown) vy = -PLAYER_SPEED;
                if (cursors.down.isDown || wasd.down.isDown) vy = PLAYER_SPEED;

                if (vx !== 0 && vy !== 0) { vx *= 0.707; vy *= 0.707; }
                player.setVelocity(vx, vy);

                const angle = Phaser.Math.Angle.Between(player.x, player.y, mousePointer.worldX, mousePointer.worldY);
                player.setRotation(angle);

                player.nameText.setPosition(player.x, player.y - 30);
                updateHpBar(player);

                // Veritabanını Senkronize Et
                if (!player.lastUpdate || time - player.lastUpdate > 40) {
                    window.gameUpdate(playerRef, {
                        x: Math.round(player.x), y: Math.round(player.y),
                        angle: parseFloat(angle.toFixed(2)), hp: player.hp, score: player.score,
                        name: playerName, lastUpdate: Date.now()
                    });
                    player.lastUpdate = time;
                }

                // Diğer Oyuncuları Yumuşat (Lerp)
                Object.values(otherPlayers).forEach((other) => {
                    if (other && other.targetX !== undefined && other.hp > 0) {
                        other.x += (other.targetX - other.x) * 0.25;
                        other.y += (other.targetY - other.y) * 0.25;
                        other.rotation = Phaser.Math.Angle.RotateTo(other.rotation, other.targetAngle, 0.25);
                        other.nameText.setPosition(other.x, other.y - 30);
                        updateHpBar(other);
                    }
                });
            }

            function fireBullet(scene, pointer) {
                const now = Date.now();
                if (now - lastFired < FIRE_RATE) return;
                lastFired = now;

                const bullet = localBullets.create(player.x, player.y, 'bullet_texture');
                if (!bullet) return;

                bullet.setDepth(5);
                const angle = Phaser.Math.Angle.Between(player.x, player.y, pointer.worldX, pointer.worldY);
                const velocity = scene.physics.velocityFromRotation(angle, BULLET_SPEED);
                bullet.setVelocity(velocity.x, velocity.y);

                const bulletId = `bullet_${userId}_${now}`;
                window.gameSet(window.gameRef(window.gameDB, `bullets/${bulletId}`), {
                    x: Math.round(player.x), y: Math.round(player.y), angle: parseFloat(angle.toFixed(2)), owner: userId, timestamp: now
                });

                scene.time.delayedCall(2500, () => {
                    bullet.destroy();
                    window.gameRemove(window.gameRef(window.gameDB, `bullets/${bulletId}`));
                });
            }

            function takeDamage(amount, attackerId) {
                if (player.hp <= 0) return;
                player.hp = Math.max(0, player.hp - amount);
                updateHpBar(player);
                document.getElementById('hp-display').textContent = player.hp;

                window.gameUpdate(playerRef, { hp: player.hp });

                if (player.hp <= 0) {
                    // Katilin skorunu arttır
                    const attackerScoreRef = window.gameRef(window.gameDB, `players/${attackerId}/score`);
                    window.gameUpdate(window.gameRef(window.gameDB, `players/${attackerId}`), {
                        score: Phaser.Math.Between(1,100) // Firebase'den mevcut skoru çekip arttırabilirsiniz, şimdilik tetiklenmesi için güncelliyoruz
                    });
                    die();
                }
            }

            function die() {
                player.setVisible(false);
                player.nameText.setVisible(false);
                player.hpBar.setVisible(false);
                player.setVelocity(0,0);

                const dText = game.scene.scenes[0].add.text(window.innerWidth/2, window.innerHeight/2, 'ÖLDÜN! Yeniden doğuyorsun...', {
                    fontSize: '32px', fill: '#e74c3c', stroke: '#000', strokeThickness: 4
                }).setOrigin(0.5).setScrollFactor(0).setDepth(100);

                game.scene.scenes[0].time.delayedCall(3000, () => {
                    dText.destroy();
                    player.setPosition(Phaser.Math.Between(200, WORLD_WIDTH-200), Phaser.Math.Between(200, WORLD_HEIGHT-200));
                    player.hp = 100;
                    player.setVisible(true); player.nameText.setVisible(true); player.hpBar.setVisible(true);
                    updateHpBar(player);
                    document.getElementById('hp-display').textContent = 100;
                    window.gameUpdate(playerRef, { x: player.x, y: player.y, hp: 100 });
                });
            }

            function updateHpBar(entity) {
                if (!entity.hpBar) return;
                entity.hpBar.clear();
                entity.hpBar.fillStyle(0x000000, 0.5);
                entity.hpBar.fillRect(entity.x - 20, entity.y - 30, 40, 5);
                const pct = Math.max(0, entity.hp / 100);
                const clr = pct > 0.5 ? 0x2ecc71 : (pct > 0.25 ? 0xf1c40f : 0xe74c3c);
                entity.hpBar.fillStyle(clr, 1);
                entity.hpBar.fillRect(entity.x - 20, entity.y - 30, 40 * pct, 5);
            }
        }
    </script>
</body>
</html>
